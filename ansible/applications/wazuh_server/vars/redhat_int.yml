---
# =========================================================================================== #
# File: '{{ role_path }}/vars/redhat_int.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Per-env overlay loaded by the generic role loader when os_family=redhat AND ENV=int.
# Merged on top of defaults/main.yml::wazuh_server_defaults via recursive combine. The whole
# s3 dict lives in the env overlay (not defaults) so the bucket + object keys + SHA-256 pins
# are chosen per environment. The org convention is an account-scoped `<account-id>-ansible`
# bucket, not env-suffixed (see docs/reference/s3-artifacts.md).
#
# s3.bucket below is RUNTIME-SUBSTITUTED (ADR-0004) — playbooks/deploy-aws-poc.yml derives the
# caller's AWS account id (amazon.aws.aws_caller_info, controller-side) and injects it as a fallback
# default via the wazuh_server override dict, so this literal `<account-id>` is never actually
# used. Do NOT hand-edit it: it is a deliberate fail-fast TRIPWIRE — if it ever reaches a real
# AWS call, that call fails immediately on an unresolvable bucket name instead of silently
# reading/writing the wrong account. The real account id is never committed to this repo.
# =========================================================================================== #

s3:
  bucket: '<account-id>-ansible'
  bundle_key: 'functions/wazuh/4.14.5/wazuh-offline.tar.gz'
  bundle_sha256: '1a60b8c407a56ed45a1e431256f6c49cba083a329874be7b532ec48a56069bea'
  certs_prefix: 'functions/wazuh/certs'
