[defaults]
# STIG-friendly tmp paths — /home, /tmp, /var/tmp are noexec on STIG'd hosts.
# /opt is exec-OK and not subject to STIG noexec mounts.
local_tmp  = /opt/ansible/tmp
remote_tmp = /opt/ansible/tmp

inventory        = ./inventory/aws/aws_ec2.yml
roles_path       = ./applications:./operating_systems
collections_path = ./.collections
# Product modules remain local; the composed framework role's controller-download module must
# also resolve from wazuh_server tasks outside that role's dynamic include scope.
library = ./library:./applications/s3_artifact_delivery/library

# Don't gather facts unconditionally — the loader does it on demand via setup module
gathering = explicit

# Default interpreter is auto-discovered (lands on /usr/libexec/platform-python on
# RHEL/Rocky 8). The dnf/rpm_key/file-with-selinux/firewalld modules use the distribution's
# supported Python C bindings. Artifact downloads use get_url over HTTPS and need no target-side
# AWS SDK or alternate interpreter.

# Fail loudly on undefined vars; surface deprecations
force_handlers       = True
nocows               = True
deprecation_warnings = True

# Lab/internal switch: hosts are short-lived, key churn is high
host_key_checking = False

# Performance: cache facts to /opt for the session
fact_caching            = jsonfile
fact_caching_connection = /opt/ansible/tmp/facts
fact_caching_timeout    = 7200

[privilege_escalation]
become          = False
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
pipelining       = True
control_path_dir = /opt/ansible/tmp/cp
