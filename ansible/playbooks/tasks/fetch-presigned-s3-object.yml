---
# Retry the complete mint-sign-fetch unit. A socket inactivity timeout is not a wall-clock
# transfer bound, so no signature is ever reused by a later attempt.

- name: 'S3 FETCH | Initialize The Per-Host Retry State'
  no_log: true
  ansible.builtin.set_fact:
    __artifact_fetch_succeeded__: false
    __artifact_fetch_result__: ''
    __artifact_fetch_terminal_failure__: false
    __artifact_presign_redaction_detected__: false

- name: 'S3 FETCH | Run Fresh-Signature Attempt 1'
  vars:
    __artifact_fetch_attempt__: 1
  no_log: true
  ansible.builtin.include_tasks: 'fetch-presigned-s3-object-attempt.yml'

- name: 'S3 FETCH | Run Fresh-Signature Attempt 2 When Needed'
  when:
    - not (__artifact_fetch_succeeded__ | bool)
    - not (__artifact_fetch_terminal_failure__ | bool)
  vars:
    __artifact_fetch_attempt__: 2
  no_log: true
  ansible.builtin.include_tasks: 'fetch-presigned-s3-object-attempt.yml'

- name: 'S3 FETCH | Run Fresh-Signature Attempt 3 When Needed'
  when:
    - not (__artifact_fetch_succeeded__ | bool)
    - not (__artifact_fetch_terminal_failure__ | bool)
  vars:
    __artifact_fetch_attempt__: 3
  no_log: true
  ansible.builtin.include_tasks: 'fetch-presigned-s3-object-attempt.yml'

- name: 'S3 FETCH | Require One Successful Fresh-Signature Attempt'
  no_log: true
  block:
    - name: 'S3 FETCH | Assert The Artifact Fetch Succeeded'
      ansible.builtin.assert:
        that:
          - __artifact_fetch_succeeded__ | bool
        quiet: true
        fail_msg: >-
          {{
            'The signer output failed the bearer-URL redaction guard.'
            if (__artifact_presign_redaction_detected__ | bool)
            else 'The artifact could not be fetched after three fresh-signature attempts.'
          }}
  always:
    - name: 'S3 FETCH | Scrub The Retry State'
      ansible.builtin.set_fact:
        __artifact_fetch_succeeded__: ''
        __artifact_fetch_result__: ''
        __artifact_fetch_terminal_failure__: ''
