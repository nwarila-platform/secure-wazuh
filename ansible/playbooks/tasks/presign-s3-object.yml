---
# Sign exactly one GetObject request beside its target fetch. The caller supplies
# artifact_presign_bucket, artifact_presign_key, and artifact_presign_fact. Delegated controller
# work remains registered on the current inventory host so signatures cannot cross host boundaries.

- name: 'S3 SIGN | Generate One Short-Lived HTTPS URL On The Controller'
  delegate_to: 'localhost'
  become: false
  no_log: true
  register: '__artifact_presign_result__'
  environment:
    TMPDIR: "{{ lookup('ansible.builtin.env', 'ANSIBLE_LOCAL_TEMP') }}"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  secure_wazuh_s3:
    mode: 'presign'
    bucket: "{{ artifact_presign_bucket }}"
    object_key: "{{ artifact_presign_key }}"
    region: "{{ AWS_DEFAULT_REGION }}"
    access_key: "{{ __artifact_read_access_key__ }}"
    secret_key: "{{ __artifact_read_secret_key__ }}"
    session_token: "{{ __artifact_read_session_token__ }}"
    expires_in: 900

- name: 'S3 SIGN | Record Whether Signer Output Is Redacted Or Empty'
  no_log: true
  vars:
    __candidate_url__: "{{ __artifact_presign_result__.url | default('') }}"
  ansible.builtin.set_fact:
    __artifact_presign_redaction_detected__: >-
      {{
        (__candidate_url__ is not string)
        or (__candidate_url__ | length == 0)
        or ('*' in __candidate_url__)
        or ('VALUE_SPECIFIED_IN_NO_LOG_PARAMETER' in __candidate_url__)
      }}

- name: 'S3 SIGN | Reject A Redacted Or Empty Bearer URL'
  no_log: true
  ansible.builtin.assert:
    that:
      - not (__artifact_presign_redaction_detected__ | bool)
    quiet: true
    fail_msg: >-
      The generated artifact URL is empty or contains an Ansible redaction marker.

- name: 'S3 SIGN | Hold The Bearer URL On The Controller'
  no_log: true
  ansible.builtin.set_fact:
    "{{ artifact_presign_fact }}": "{{ __artifact_presign_result__.url }}"
    cacheable: false
