---
# =========================================================================================== #
# File: 'ansible/playbooks/tasks/derive_aws_account_id.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# ADR-0004 shared task: derive THIS RUN's own AWS account id, controller-side, via
# `sts:GetCallerIdentity` (amazon.aws.aws_caller_info) — no IAM grant required and the call cannot
# be denied, unlike `.account_alias` (needs iam:ListAccountAliases, which IS deniable). Registers
# `__aws_caller_info__`; consumers read `__aws_caller_info__.account` directly as an ordinary,
# lazily-evaluated play var — no set_fact hop (R3; see site.yml's ADR-0004 header comment and each
# stage's s3.bucket comment for the full rationale).
#
# Imported (ansible.builtin.import_tasks, NOT include_tasks) once per stage in site.yml (Stage 1
# pre_tasks, Stage 2 pre_tasks, Stage 3 tasks) rather than the identical block being written 3x
# inline:
#   - Every stage still runs this itself. import_tasks is STATIC (resolved at playbook-parse
#     time) — the spliced-in task behaves exactly as if written inline in that stage's own play,
#     which matters because each stage is a SEPARATE PLAY against a SEPARATE host group: `register`
#     stores its result per-host, so Stage 1's result (parked under the wazuh_servers host) is
#     simply absent from Stage 2/3's different hosts.
#   - `run_once: true` below (so N agent hosts in one stage don't each fire their own redundant
#     STS call, all delegated to the same localhost) pairs more robustly with a STATIC import than
#     a dynamic include_tasks: run_once combined with a runtime-resolved include has known edge
#     cases under a host-limited (--limit) run, where the host Ansible would pick to execute on can
#     fall outside the limited set and the task is skipped rather than re-targeted. A static import
#     carries no such risk — at parse time it is indistinguishable from a task written inline.
#   - With run_once, Ansible fans the registered result out to every host in the invoking play, so
#     `__aws_caller_info__` stays a plain, bare-name-referenceable var for each of that stage's
#     hosts, not only the one host that actually executed the call.
# =========================================================================================== #

- name: 'AWS | Derive Runtime AWS Account ID (Controller-Side, STS GetCallerIdentity Only)'
  delegate_to: 'localhost'
  become: false
  run_once: true
  no_log: true
  register: '__aws_caller_info__'
  vars:
    # Run boto3 under the SAME interpreter that runs ansible-playbook (the runner venv, which
    # already has boto3/botocore) — the localhost analogue of the Linux target's /opt/ansible/venv
    # override, mirroring the only other delegate_to: localhost site in this codebase
    # (wazuh_agent/tasks/present_windows.yml's controller-delegated S3 fetch). no_log: true
    # because the module args below carry AWS creds, exactly like every amazon.aws task in this
    # repo; the derived account id itself is exactly the value ADR-0004 keeps out of committed
    # files, so it stays out of the run log too (this repo has already suffered an
    # account-id-in-logs leak).
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  amazon.aws.aws_caller_info:
    region: "{{ AWS_DEFAULT_REGION | default(omit, true) }}"
    access_key: "{{ AWS_ACCESS_KEY_ID | default(omit, true) }}"
    secret_key: "{{ AWS_SECRET_ACCESS_KEY | default(omit, true) }}"
    session_token: "{{ AWS_SESSION_TOKEN | default(omit, true) }}"
