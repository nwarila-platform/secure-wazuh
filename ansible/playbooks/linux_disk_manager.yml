---
# =========================================================================================== #
# File: 'ansible/playbooks/linux_disk_manager.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Step-0 storage initializer. Run this BEFORE the Wazuh stack so the data disk is provisioned
# and mounted at /mnt/data for the server role to consume. Selects the disk by its stable WWN
# (never /dev/sdX) and mounts by UUID (Nitro-safe) — see the linux_disk_manager role README.
#
#   ansible-playbook -i lab/inventory.yml playbooks/linux_disk_manager.yml -e env=int
#
# `platform` and `disks` below are OVERRIDABLE, not hardcoded: each is a template of the form
# `{{ wazuh_disk_platform | default('vmware', true) }}` / `{{ wazuh_disks | default([...], true) }}`,
# so any higher-precedence source that sets `wazuh_disk_platform` / `wazuh_disks` (inventory
# group/host vars, -e) wins; the literal values shown are only the fallback default, used when
# nothing else defines those vars. That fallback is the tcnhq-waz01c VMware lab VM
# (disk.EnableUUID=TRUE) — this is what makes an un-parameterized lab run still work. Per-target
# values are supplied at higher precedence: Proxmox declares them on the wazuh_servers host in
# inventory/proxmox.yml; AWS sets wazuh_disk_platform=aws AND wazuh_disks statically in
# inventory/aws/group_vars/wazuh_servers.yml — no -e needed. wazuh_disks there declares a
# `function` (EBS Function tag) instead of a literal unique_id; the role's own AWS resolver
# (linux_disk_manager's tasks/resolve_aws.yml) turns that into a real unique_id at run time.
# =========================================================================================== #

- name: 'Provision data disks (linux_disk_manager)'
  hosts: 'wazuh_servers'
  gather_facts: false
  become: true
  vars:
    ENV: "{{ env }}"
    # Lab fallback disk (tcnhq-waz01c VMware VM, disk.EnableUUID=TRUE) — used only when the
    # target does not supply wazuh_disks itself (see header). Selected by its stable WWN
    # (never /dev/sdX); mounted by UUID (Nitro-safe) — see the linux_disk_manager role README.
    __wazuh_lab_default_disks__:
      - unique_id:   'wwn-0x6000c29002d930a06602efdd4ab53a15'
        mount_point: '/mnt/data'
        fstype:      'xfs'
        label:       'wazuh-data'
        # Data mount: nodev,nosuid (STIG-friendly) but NOT noexec — the Wazuh indexer
        # stages/runs content under /mnt/data.
        opts:        'defaults,nodev,nosuid'
        passno:      2
  roles:
    - role: 'linux_disk_manager'
      linux_disk_manager:
        platform: "{{ wazuh_disk_platform | default('vmware', true) }}"
        disks:    "{{ wazuh_disks | default(__wazuh_lab_default_disks__, true) }}"
