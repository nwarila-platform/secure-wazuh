---
# =========================================================================================== #
# File: 'ansible/playbooks/wazuh_agent_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Standalone WINDOWS agent deploy — a thin wrapper over the wazuh_agent role's NATIVE Windows
# entry point (tasks/main_windows.yml). The role owns the whole flow (MSI from S3 -> verify ->
# install + auto-enroll -> real-time FIM -> service); this playbook just targets the Windows
# group and supplies the AWS runner creds the delegated S3 download needs.
#
# The FIRST entry below imports windows_ssh_bootstrap.yml, which flips the Windows target's
# OpenSSH DefaultShell from cmd (the framework's deliberate launch-time default) to PowerShell
# (this product's group_vars/aws/wazuh_agents_windows.yml `ansible_shell_type` contract) — see
# that file's own header for the full why/how. It must run first and stays idempotent.
# SINGLE SOURCE OF TRUTH: site.yml's Stage 3 imports the SAME file immediately before its own
# Windows play — never duplicate that bootstrap play inline here or there.
#
# The MSI is pulled from S3 exactly like the Linux RPM — pinned by key + sha256 in the role's
# vars/windows_<env>.yml overlay. Because a Windows target can't run boto3, amazon.aws.s3_object
# runs DELEGATED to the controller (venv boto3 + these creds) and win_copy pushes the verified
# MSI. Required vars: env; AWS creds sourced from the runner env by aws_runner_env.yml.
#
#   ansible-playbook -i <win-inventory> playbooks/wazuh_agent_windows.yml -e env=int
#
# Windows deploys do NOT import bootstrap.yml (the /opt/ansible/venv is a Linux target concern).
#
# S3 BUCKET (ADR-0004): this standalone does NOT wire the account-id derive site.yml's stages
# use, so the role's s3.bucket stays the committed overlay's literal `<account-id>-ansible`
# fail-fast tripwire and the run fails at S3 (including the MSI pull above) unless given a real
# bucket. Either pass `-e wazuh_s3_bucket=<account-id>-ansible` explicitly, or run via
# deploy_all.yml/site.yml, which derive it automatically.
# =========================================================================================== #

- name: 'Bootstrap Windows OpenSSH DefaultShell (cmd -> PowerShell)'
  ansible.builtin.import_playbook: 'windows_ssh_bootstrap.yml'

- name: 'Deploy Wazuh agent (Windows endpoints)'
  hosts: 'wazuh_agents_windows'
  gather_facts: false
  become: false
  vars_files: ['aws_runner_env.yml']
  vars:
    ENV: "{{ env }}"
  tasks:

    - name: 'Deploy via the wazuh_agent role (native Windows entry)'
      ansible.builtin.include_role:
        name: 'wazuh_agent'
        tasks_from: 'main_windows'
