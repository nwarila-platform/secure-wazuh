---
# =========================================================================================== #
# File: 'ansible/playbooks/e2e_full.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# THE one Ansible command per e2e-full.yml phase (see that workflow, or run this by hand against
# a live AWS PoC):
#
#   ansible-playbook -i inventory/aws/aws_ec2.yml playbooks/e2e_full.yml
#
# ZERO -e: every input this needs is now a committed inventory/role fact (env, wazuh_disk_platform,
# wazuh_disks, wazuh_cert_name's role-side default, the aws_ec2.yml `state` fix, ...) — the LAST
# living exception is the operator secret; CI supplies it via the WAZUH_ADMIN_PASSWORD environment
# variable (no -e needed there either; see
# site.yml's admin_password chain).
#
# TWO-PHASE e2e USAGE (the cumulative 4/4 proof — see wazuh_trigger_fim.yml's header for the
# full ledger rationale):
#   Phase 1 — run once right after `terraform apply` stands the 3-system environment up (AIO +
#     Linux agent + Windows agent). Deploys everything, then fires + proves 2 fresh FIM events
#     (one per agent platform).
#   Phase 2 — run again after `terraform apply -var refresh_serial=1` (the AIO's OS-swap
#     replacement) and its subsequent Terraform apply completes. Step 1 below reinstalls the
#     swapped AIO from scratch (fresh root OS, same re-attached data disk); the two agents are
#     untouched by the swap (refresh = false) and simply reconnect idempotently. Step 2 then
#     fires 2 MORE fresh events and proves ALL FOUR cumulative ledger entries — the 2 pre-swap
#     survivors AND the 2 new ones — cumulative by construction because the ledger itself lives
#     on the AIO's data disk, which the swap never touches.
#
# Composition: deploy_all.yml already covers disk -> venv -> AIO stack -> both agent groups
# (any empty group is a no-op), so this file adds exactly one more step on top of it —
# wazuh_trigger_fim.yml's own 4 plays (Linux trigger, Windows trigger, ledger, cumulative
# validate) — rather than duplicating deploy_all.yml's sequence here.
# =========================================================================================== #

- name: 'Step 1 - Provision, Deploy, And Enroll (deploy_all.yml)'
  ansible.builtin.import_playbook: 'deploy_all.yml'

- name: 'Step 2 - Trigger + Prove FIM, Cumulatively (wazuh_trigger_fim.yml)'
  ansible.builtin.import_playbook: 'wazuh_trigger_fim.yml'
