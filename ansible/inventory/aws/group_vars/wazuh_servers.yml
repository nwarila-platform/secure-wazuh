---
# =========================================================================================== #
# File: 'ansible/inventory/aws/group_vars/wazuh_servers.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# wazuh_server role override for the AIO host, plus this group's linux_disk_manager targeting
# (wazuh_disk_platform, wazuh_disks). Connection vars come from group_vars/all.yml unchanged.
#
# endpoint_host is set EXPLICITLY rather than left at its '' default. wazuh_server's own loader
# derives __endpoint_host__ as `config.endpoint_host | default(ansible_host | default(
# inventory_hostname), true)` (applications/wazuh_server/tasks/present_redhat.yml:26; the '' ->
# ansible_host fallback is documented at applications/wazuh_server/defaults/main.yml:95) and uses
# it for the on-target manager-API health/auth checks — `https://{{ __endpoint_host__ }}:55000/...`
# (present_redhat.yml:940,970,999). Because aws_ec2.yml deliberately sets ansible_host to the EC2
# instance-id (for SSH-over-SSM), the '' default would resolve __endpoint_host__ to that
# instance-id too — not a dialable address — and the on-target health/auth checks would fail
# against it. The AIO's own private IP is supplied here instead, straight from the dynamic
# inventory's own hostvars, the same treatment group_vars/wazuh_agents*.yml gives manager.host.
#
# (The dashboard's equivalent check does not need this: __dashboard_endpoint_host__ falls back to
# 127.0.0.1, not ansible_host, so it is unaffected either way — present_redhat.yml:33-36.)
# =========================================================================================== #

wazuh_server:
  endpoint_host: "{{ hostvars[inventory_hostname].private_ip_address }}"

# linux_disk_manager targeting (see playbooks/linux_disk_manager.yml header for the
# wazuh_disk_platform / wazuh_disks default() override contract). AWS's by-id disk provider is
# always 'aws' regardless of which instance/volume Terraform creates, so — unlike wazuh_disks
# below — this is a static, safe-to-commit fact.
wazuh_disk_platform: aws

# wazuh_disks is committed directly (no -e needed): `function` names the EBS volume's Function
# tag (terraform/aws.tfvars' ebs_block_devices[].tags.Function) rather than the volume-id
# itself, so — unlike the unique_id it used to require — there is a fixed, stable value to
# commit even though the volume-id Terraform assigns at create time is not known here.
# linux_disk_manager's AWS resolver (ansible-framework, tasks/resolve_aws.yml) turns `function`
# into the same `nvme-Amazon_Elastic_Block_Store_<volid>` unique_id at run time — see
# linux_disk_manager/defaults/main.yml's "function RESOLUTION CONTRACT" for the mechanics.
# Without a matching Function-tagged volume attached to this instance, that resolver fails
# loudly (zero or multiple matches) rather than silently mounting the wrong disk.
wazuh_disks:
  - function: 'wazuh-data'
    mount_point: '/mnt/data'
    fstype: 'xfs'
    label: 'wazuh-data'
    opts: 'defaults,nodev,nosuid'
    passno: 2
