---
# =========================================================================================== #
# File: 'ansible/inventory/aws/group_vars/wazuh_agents.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# wazuh_agent role overrides for the Linux endpoint group. Connection vars come from
# group_vars/all.yml unchanged; only the role's own config dict lives here.
#
# manager.host is set EXPLICITLY rather than left to the role's own "first host in wazuh_servers"
# default (wazuh_agent/defaults/main.yml), because that default resolves through ansible_host —
# which aws_ec2.yml deliberately sets to the EC2 instance-id (for SSH-over-SSM), not an IP. An
# agent cannot enroll against an instance-id, so the manager's real private IP is derived here
# instead, straight from the dynamic inventory's own hostvars for whichever host currently sits
# in wazuh_servers.
# =========================================================================================== #

wazuh_agent:
  manager:
    host: "{{ hostvars[groups['wazuh_servers'][0]].private_ip_address }}"
  fim:
    # Watch /etc in real time (same directory the manager watches) so editing /etc/hosts on this
    # endpoint emits an immediate agent-sourced FIM alert (rule 550/554). The vendor default only
    # scans /etc every 12h. Matches lab/inventory.yml's wazuh_agents FIM config.
    realtime_paths: ['/etc']
