---
# =============================================================================
# Deploy Workflow — commit-to-main GitOps for the secure-wazuh product
# =============================================================================
# ONE repo, TWO targets, driven by every push to main — but only ONE of them is live today:
#
#   proxmox  — the PERMANENT live instance. PARKED (`if: false`); see that job's own header.
#   aws      — an EPHEMERAL proof-of-concept. Terraform applies, then ONE Ansible playbook
#              (playbooks/deploy-aws-poc.yml) configures the stack AND proves a real
#              agent-sourced FIM event on each endpoint; the environment is ALWAYS torn down
#              afterwards (deploy -> prove -> destroy).
#
# The AWS job COMPOSES Ansible at run time: the generic loader + shared roles — including
# `wazuh_agent` and `linux_disk_manager` — live in the pinned `ansible-framework` (SHA in
# .github/.framework-pin); this repo's ONE product-specific role (`wazuh_server`) is overlaid
# on top into a throwaway `_dev-build/` tree, exactly as the dev-only compose script does locally.
# The whole AWS target is two committed files: playbooks/deploy-aws-poc.yml and
# inventory/aws/aws_ec2.yml. No --extra-vars, ever.
#
# Terraform is DATA-ONLY here: this repo ships terraform/{proxmox,aws}.tfvars and
# NO .tf files. The resource logic lives in the pinned proxmox-vm-terraform-
# framework / aws-terraform-framework, which we check out and run with
# -var-file pointing back at this repo's tfvars.
#
# Operator prerequisites are named at their point of use. With those org-level
# credentials and infrastructure in place, this workflow performs the real deploy/prove/destroy
# cycle described above.

name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - ansible/**
      - terraform/**
      - .github/.framework-pin
      - .github/.aws-tf-framework-pin
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Least privilege at the workflow level; each job elevates only what it needs.
permissions: {}

# Exactly one deploy in flight per ref. cancel-in-progress is FALSE on purpose —
# an in-flight `terraform apply` must never be interrupted mid-mutation.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Framework source repositories composed/run at deploy time.
  # Their immutable refs are committed in .github/.framework-pin and
  # .github/.aws-tf-framework-pin, then resolved with tr in the checkout steps below.
  ANSIBLE_FRAMEWORK_REPO: nwarila-platform/ansible-framework
  # Consumed only by the PARKED proxmox job; kept here so un-parking it needs no re-wiring.
  PROXMOX_TF_FRAMEWORK_REPO: nwarila-platform/proxmox-vm-terraform-framework
  AWS_TF_FRAMEWORK_REPO: nwarila-platform/aws-terraform-framework
  # Controller toolchain. RHEL/Rocky 8 targets run platform-python 3.6.8, so the
  # CONTROLLER ansible-core must stay on the last line that can manage a 3.6 target.
  ANSIBLE_CORE_SPEC: ">=2.16,<2.17"

jobs:

  # ===========================================================================
  # PROXMOX — PARKED. The permanent in-place target is not wired to any playbook
  # right now: ansible/playbooks/ holds exactly ONE file, deploy-aws-poc.yml, which
  # targets the AWS PoC only. The deploy logic this job used to run (disk -> venv ->
  # AIO stack -> agents) now lives inside deploy-aws-poc.yml, and the previous plays
  # and this job's original Terraform/Ansible steps remain in git history — restore
  # them from there when Proxmox is picked back up.
  #
  # `if: false` is the gate: a skipped job never schedules a runner, never runs a
  # step, and never fails, so this cannot break the deploy loop while parked. Its
  # single placeholder step exists only because a job requires a non-empty `steps:`.
  # ===========================================================================
  proxmox:
    name: Proxmox (parked)
    if: false
    # The permanent instance lives on a private lab VLAN (10.69.112.0/24),
    # unreachable from GitHub-hosted runners. When this job is un-parked it MUST run on
    # a self-hosted runner with line-of-sight to the Proxmox API AND SSH to the target VM.
    runs-on: [self-hosted, linux, proxmox-lab]
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Parked — Proxmox deploy is not wired to a playbook
        run: echo "The Proxmox job is parked; see this job's header comment."

  # ===========================================================================
  # AWS — EPHEMERAL proof-of-concept, deploy -> prove -> ALWAYS destroy
  # ===========================================================================
  aws:
    name: AWS (ephemeral, deploy-prove-destroy)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # The AWS PoC is a singleton (same aws.tfvars tags), so serialize with e2e-full.yml
    # regardless of ref.
    concurrency:
      group: secure-wazuh-aws-poc
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write # required for AWS OIDC federation (no long-lived keys)

    env:
      # WAZUH_ENV now selects ONE thing: the `tag:Environment` filter the aws_ec2 inventory
      # plugin discovers hosts by (inventory/aws/aws_ec2.yml's `filters:`, which reads this env
      # var and falls back to 'poc'). It must therefore match terraform/aws.tfvars' own
      # Environment tag — `poc` — or the inventory returns zero hosts. It is NOT the role-overlay
      # selector any more: deploy-aws-poc.yml declares `ENV: 'int'` literally in every play that
      # runs a role loader, because that playbook targets exactly one environment.
      # The bundle bucket stays `<AWS_ACCOUNT_ID>-ansible` (not env-suffixed) and is derived at
      # runtime by the playbook itself (ADR-0004), never passed in here.
      # Org-global secrets provide AWS_ACCOUNT_ID and AWS_EC2_SSH_PRIVATE_KEY. TF_STATE_BUCKET is
      # derived below as <AWS_ACCOUNT_ID>-terraform; the optional AWS_REGION org variable defaults
      # to us-east-1.
      # The repo commits the framework pins (.framework-pin + .aws-tf-framework-pin, both SHAs);
      # role ARN, bundle bucket, stack, and owner are derived.
      WAZUH_ENV: poc
      TF_DIR: .frameworks/aws-tf/terraform

    steps:
      - name: Checkout secure-wazuh
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # aws-terraform-framework's runner protocol (docs/reference/runner-protocol.md,
      # "Deployment Identity Tags"). Exports TF_VAR_resource_metadata for every later terraform
      # step in this job; docs/reference/aws-iam/README.md's StampRepoIdentityTags / RequestTag
      # conditions require it on every create-call, or they deny the request. The proxmox job
      # has no AWS deployment identity or targets to derive, so this step is AWS-job-only.
      - name: Derive deployment identity + targets
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPOSITORY_ID: ${{ github.repository_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          stack="${GH_REPOSITORY##*/}"          # repo name, e.g. secure-wazuh
          owner="${GH_OWNER}"                    # org, e.g. nwarila-platform
          commit_sha="$(git rev-parse HEAD)"
          {
            echo "DEPLOY_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/github_${owner}_${stack}"
            echo "BUNDLE_BUCKET=${AWS_ACCOUNT_ID}-ansible"
            echo "TF_STATE_BUCKET=${AWS_ACCOUNT_ID}-terraform"
            # Org state-key convention is <owner>/<repo>/<target>.tfstate — derived, so it always
            # matches the bucket layout (and the IAM policy scoped to that prefix) with no input.
            echo "TF_STATE_KEY_PREFIX=${owner}/${stack}"
            printf 'TF_VAR_resource_metadata=%s\n' "$(jq -cn \
              --arg repository "$GH_REPOSITORY" --arg repository_id "$GH_REPOSITORY_ID" \
              --arg stack "$stack" --arg owner "$owner" \
              --arg commit_sha "$commit_sha" --arg run_id "$GH_RUN_ID" \
              '{repository:$repository,repository_id:$repository_id,stack:$stack,owner:$owner,commit_sha:$commit_sha,run_id:$run_id}')"
          } >> "$GITHUB_ENV"

      - name: Resolve ansible-framework pin
        id: pin
        run: echo "sha=$(tr -d ' \n\r' < .github/.framework-pin)" >> "$GITHUB_OUTPUT"

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.ANSIBLE_FRAMEWORK_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: .frameworks/ansible-framework
          persist-credentials: false
          # ansible-framework is public — the default GITHUB_TOKEN reads it; no PAT needed.

      - name: Resolve aws-terraform-framework pin
        id: tfpin
        run: echo "sha=$(tr -d ' \n\r' < .github/.aws-tf-framework-pin)" >> "$GITHUB_OUTPUT"

      - name: Checkout aws-terraform-framework (pinned)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.AWS_TF_FRAMEWORK_REPO }}
          # Version-locked in .github/.aws-tf-framework-pin — a committed SHA mirroring
          # .framework-pin; e2e-full.yml reads the same file. Not a repo variable.
          ref: ${{ steps.tfpin.outputs.sha }}
          path: .frameworks/aws-tf
          persist-credentials: false
          # aws-terraform-framework is public — the default GITHUB_TOKEN reads it; no PAT needed.

      # -----------------------------------------------------------------------
      # AWS auth via OIDC — no long-lived credentials in the repo
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # The role ARN is derived from the org-global AWS_ACCOUNT_ID and the
          # github_<owner>_<repo> naming convention. Its trust is repository-scoped; its
          # permissions retain the existing EC2/EBS/VPC + S3 + Terraform-state limits.
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        # configure-aws-credentials exports AWS_ACCESS_KEY_ID / _SECRET_ACCESS_KEY /
        # _SESSION_TOKEN / AWS_REGION into the runner env for every later step, which is exactly
        # what deploy-aws-poc.yml's per-play `lookup('ansible.builtin.env', ...)` credential
        # bridge reads for the offline-bundle download.

      # -----------------------------------------------------------------------
      # Terraform — apply the ephemeral environment
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          # aws-terraform-framework pins `required_version = "= 1.15.1"` EXACTLY
          # (terraform/versions.tf) — must match that pin, not just satisfy a range.
          terraform_version: "1.15.1"
          terraform_wrapper: false

      - name: Terraform init (aws)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY_PREFIX }}/aws.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Terraform apply (aws)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var-file="${{ github.workspace }}/terraform/aws.tfvars"

      # -----------------------------------------------------------------------
      # Ansible — compose the framework + this repo's role, then configure. The inventory is
      # NOT generated here any more: inventory/aws/aws_ec2.yml discovers the just-applied
      # instances dynamically from their org auto-tags, so the AWS target is exactly two
      # committed files (that inventory + playbooks/deploy-aws-poc.yml).
      # -----------------------------------------------------------------------
      - name: Setup Python (controller)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Compose _dev-build (framework base + product-role overlay)
        run: |
          set -euo pipefail
          DEV_BUILD="${GITHUB_WORKSPACE}/_dev-build"
          rm -rf "${DEV_BUILD}"; mkdir -p "${DEV_BUILD}"
          rsync -a "${GITHUB_WORKSPACE}/.frameworks/ansible-framework/" "${DEV_BUILD}/"
          rsync -a "${GITHUB_WORKSPACE}/ansible/" "${DEV_BUILD}/"

      - name: Install ansible-core + collections
        working-directory: _dev-build
        env:
          # Collections must land in the SAME collections_path the composed ansible.cfg
          # points ansible-playbook at (must run AFTER Compose, for the same reason).
          ANSIBLE_CONFIG: ${{ github.workspace }}/_dev-build/ansible.cfg
        run: |
          python -m pip install --no-cache-dir "ansible-core${ANSIBLE_CORE_SPEC}"
          # boto3/botocore: required by amazon.aws modules that run CONTROLLER-side on THIS
          # runner — amazon.aws.aws_caller_info (ADR-0004's runtime account-id derivation, both
          # jobs, delegate_to: localhost under ansible_playbook_python) and the Windows-agent
          # MSI fetch's delegate_to: localhost amazon.aws.s3_object (same interpreter).
          # Target-side boto3 (RHEL dnf side_deps + the /opt/ansible/venv that
          # deploy-aws-poc.yml's Linux Bootstrap section builds) is a separate dependency.
          python -m pip install --no-cache-dir boto3 botocore
          ansible-galaxy collection install -r "${GITHUB_WORKSPACE}/ansible/requirements.yml"

      # inventory/aws/aws_ec2.yml's compose: block pins
      # ansible_ssh_private_key_file to ~/.ssh/secure-wazuh-poc-key.pem (the '~' is expanded by
      # the ssh connection plugin against the runner user's home), so the key must land there.
      - name: Write target SSH key
        run: |
          set -euo pipefail
          # The org-global AWS_EC2_SSH_PRIVATE_KEY secret is the private half of
          # terraform/aws.tfvars' key_name = "secure-wazuh-poc-key".
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/stdin "$HOME/.ssh/secure-wazuh-poc-key.pem" <<< "${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}"

      # The PoC security group has zero inbound rules (docs/reference/aws-iam/README.md), so
      # inventory/aws/aws_ec2.yml tunnels every ssh/sftp/scp call through
      # `aws ssm start-session --document-name AWS-StartSSHSession`. That ProxyCommand shells out
      # to the Session Manager plugin — a separate binary the AWS CLI does NOT bundle and
      # ubuntu-latest does not ship. Without it every host is UNREACHABLE with the misleading
      # "Connection closed by UNKNOWN port 65535". Same step as e2e-full.yml's.
      - name: Install the SSM Session Manager plugin (SSH transport for the zero-ingress hosts)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      # `terraform apply` returns when the API says the instances exist, NOT when their SSM agents
      # have registered — and SSM is the only way in. Ansible would otherwise race a host that is
      # still booting (Windows is the slow one). Poll until all three systems report Online.
      - name: Wait for all three systems to register with SSM
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            online="$(aws ssm describe-instance-information \
              --filters "Key=tag:Environment,Values=poc" \
              --query 'length(InstanceInformationList[?PingStatus==`Online`])' --output text)"
            echo "SSM Online: ${online}/3"
            [ "${online}" = "3" ] && exit 0
            sleep 20
          done
          echo "::error::Only ${online:-0}/3 systems registered with SSM within 15 minutes" >&2
          exit 1

      # THE deploy: one playbook, zero --extra-vars, against the dynamic inventory. It provisions
      # the data disk, builds the venv, deploys the AIO stack, enrolls both agent platforms, then
      # fires and PROVES a real agent-sourced FIM event per platform — which is why this job no
      # longer carries a separate CI-only proof step of its own.
      - name: Run deploy-aws-poc.yml (disk + venv + AIO stack + agents + FIM proof)
        working-directory: _dev-build
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/_dev-build/ansible.cfg
          # AWS_* for the offline bundle come from the OIDC step above (runner env), read by the
          # playbook's per-play credential bridge and passed as no_log module args — never
          # exported into a target shell.
          # Belt-and-suspenders: the "Configure AWS credentials (OIDC)" step above already
          # exports AWS_REGION into the runner env for every later step, and that bridge prefers
          # AWS_REGION over this — so this explicit alias is redundant today. Kept deliberately as
          # a fallback in case a future change to the OIDC action or step ordering ever stops
          # exporting AWS_REGION here.
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # WAZUH_ADMIN_PASSWORD is deliberately NOT bound: this ephemeral target mints its own
          # admin credential in the playbook's Step 0, per run, and that value outranks the
          # env-var leg of the role's precedence chain. Nothing here has a password to supply.
        run: |
          set -euo pipefail
          ansible-playbook -i inventory/aws/aws_ec2.yml playbooks/deploy-aws-poc.yml

      - name: Guard — /mnt/data is a real mountpoint
        working-directory: _dev-build
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/_dev-build/ansible.cfg
        run: |
          set -euo pipefail
          # Defense-in-depth, read-only post-flight check — deliberately redundant with the two
          # in-playbook guards that catch an unmounted /mnt/data FIRST, inside the
          # ansible-playbook run itself: linux_disk_manager's own mount task
          # (`ansible.posix.mount: state: mounted` fails loudly if the mount never takes) and
          # deploy-aws-poc.yml's Stage 1 'BEGIN | Assert /mnt/data Is A Mounted Data Disk',
          # which runs before PREP stages the 1.66GB offline bundle. linux_disk_manager's
          # present_redhat.yml deliberately does NO defensive validation of its own — its header
          # names that "CI/CD's responsibility" — and this target is a FRESH unformatted EBS
          # volume every run, so keep this independent check rather than treating it as dead
          # weight.
          ansible wazuh_servers -i inventory/aws/aws_ec2.yml \
            -m ansible.builtin.command -a 'mountpoint -q /mnt/data'

      # -----------------------------------------------------------------------
      # DESTROY — always tear the ephemeral environment down, pass or fail
      # -----------------------------------------------------------------------
      - name: Terraform destroy (aws, ephemeral)
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var-file="${{ github.workspace }}/terraform/aws.tfvars"
