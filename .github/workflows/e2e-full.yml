---
# =============================================================================
# E2E-Full Workflow — two-phase AWS deploy / OS-swap / destroy test for secure-wazuh
# =============================================================================
# Manual, expensive, destructive-cycle proof of the AIO's OS-swap ("replace-OS-only") lever —
# NOT part of the routine per-commit deploy.yml loop. Stands up the full 3-system AWS PoC (AIO +
# Linux agent + Windows agent), proves 2 fresh agent-sourced FIM events (phase 1), force-replaces
# ONLY the AIO's OS via `terraform apply -var refresh_serial=1` (its data disk survives,
# re-attached to the new instance), redeploys, then proves the Director's "all 4" — the 2
# pre-swap survivors AND 2 new events, cumulative by construction (see wazuh_trigger_fim.yml's
# ledger header) — before ALWAYS tearing everything down.
#
# ONE Ansible command drives both phases identically (see playbooks/e2e_full.yml's own header):
#   ansible-playbook -i inventory/aws/aws_ec2.yml playbooks/e2e_full.yml
# ZERO -e: every input is a committed inventory/role fact; the operator secret comes from the
# WAZUH_ADMIN_PASSWORD env below (this workflow's secret), never an extra-var.
#
# Mirrors .github/workflows/deploy.yml's AWS job conventions throughout (SHA-pinned actions,
# .framework-pin resolution, the compose/collections/creds plumbing) — see that file for shared
# rationale not repeated here. ONE deliberate deviation: terraform_version below is "1.15.1", not
# deploy.yml's "1.15.3" — aws-terraform-framework pins `required_version = "= 1.15.1"` EXACTLY
# (terraform/versions.tf), which "1.15.3" does not actually satisfy; matching the framework's
# real constraint here rather than reproducing that mismatch.
#
# -----------------------------------------------------------------------------
# AWS CONFIGURATION MODEL — org-global secrets provide AWS_ACCOUNT_ID and
# AWS_EC2_SSH_PRIVATE_KEY; org variables provide TF_STATE_BUCKET and optional AWS_REGION
# (defaults to us-east-1); the repo provides WAZUH_ADMIN_PASSWORD and commits the framework pins
# (.framework-pin + .aws-tf-framework-pin, both SHAs). Role ARN, bundle bucket, stack, and owner
# are derived at runtime.
# Remaining operator wiring is flagged inline with `# WIRE:`.
# -----------------------------------------------------------------------------

name: e2e-full

# Fires automatically ONCE per merge request: at MR-open, at reopen, and at draft->ready-for-
# review (the `types:` list below). `synchronize` — GitHub's "new commit pushed to this MR"
# event — is DELIBERATELY ABSENT, so pushing more commits to an already-open MR does NOT re-run
# this. The `rerun-poc` label is the ONLY way to force a fresh proof on an already-open MR —
# apply it to fire another run on demand; the job-level `if:` below gates every OTHER label so
# an unrelated label change (triage, size/*, anything) never triggers a real AWS spend.
# workflow_dispatch stays available for a fully manual run. Neither trigger ever fires on a
# push/merge to main — this workflow is MR-evidence-only, not part of the deploy loop
# (deploy.yml owns that).
#
# RECURSION SAFE: the "Fold evidence into the MR" step below commits onto the SAME PR branch
# this workflow just proved — authored via GITHUB_TOKEN (github.token), and GitHub does not let
# GITHUB_TOKEN-authored pushes trigger further workflow runs. Belt-and-suspenders: `synchronize`
# isn't in `types:` above either, so that commit's own synchronize event is not something this
# workflow listens for regardless.
#
# COST: roughly $1 of real AWS spend per MR-open (or per `rerun-poc` label), $0 standing — the
# same deploy/prove/destroy discipline as deploy.yml's AWS job, just PR-triggered instead of
# push-triggered.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths:
      - ansible/**
      - terraform/**
      - .github/.framework-pin
      - .github/workflows/e2e-full.yml

# Least privilege at the workflow level; the one job elevates only what it needs.
permissions: {}

# Deliberately shared with deploy.yml's AWS job: both apply the same aws.tfvars against one
# singleton, same-tagged PoC environment. This also serializes two e2e-full runs; an in-flight
# apply, OS-swap, or destroy must never overlap another run or be interrupted mid-mutation.
concurrency:
  group: secure-wazuh-aws-poc
  cancel-in-progress: false

env:
  # Framework source repositories composed/run at deploy time — same slugs as deploy.yml.
  # WIRE: confirm these org/repo slugs; the pinned refs are repo variables below.
  ANSIBLE_FRAMEWORK_REPO: nwarila-platform/ansible-framework
  AWS_TF_FRAMEWORK_REPO: nwarila-platform/aws-terraform-framework
  # Controller toolchain. RHEL/Rocky 8 targets run platform-python 3.6.8, so the CONTROLLER
  # ansible-core must stay on the last line that can manage a 3.6 target.
  ANSIBLE_CORE_SPEC: ">=2.16,<2.17"
  TF_DIR: .frameworks/aws-tf/terraform

jobs:

  # ===========================================================================
  # ONE job, ONE workspace: every terraform command below reuses the SAME initialized working
  # directory (init runs once, near the top) so local terraform state persists step to step —
  # phase-1 apply, the OS-swap apply, phase-2's ansible run, and the final destroy all see the
  # SAME state Terraform already knows about, with no re-checkout/re-init in between. Splitting
  # this across multiple jobs would force a fresh checkout (and a fresh init) per job, which is
  # exactly what this single-job design avoids.
  # ===========================================================================
  e2e-full:
    name: AWS (e2e-full, two-phase deploy / OS-swap / destroy)
    # Every `pull_request` event type EXCEPT `labeled` always runs (open/reopen/ready-for-review
    # are each a deliberate one-shot trigger). For `labeled`, only the `rerun-poc` label passes —
    # any other label a maintainer applies must NOT spend real AWS money. workflow_dispatch
    # (github.event_name != 'pull_request') always passes this gate.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'rerun-poc'
    runs-on: ubuntu-latest
    # Bounded headroom for two deployments, Windows arming, cumulative proof, and three
    # infrastructure mutations. A job-level timeout is NOT a teardown guarantee: the durable
    # backstop must be an out-of-job, account-side reaper keyed by
    # nwarila:management:repository-id / stack deployment tags (tracked hardening item).
    timeout-minutes: 180

    permissions:
      # contents: write (was read) — the "Fold evidence into the MR" step below commits
      # docs/reference/poc-evidence.md onto the PR head branch via the GitHub contents API.
      contents: write
      id-token: write # required for AWS OIDC federation (no long-lived keys)

    steps:
      # -----------------------------------------------------------------------
      # Source checkout + pinned framework checkouts
      # -----------------------------------------------------------------------
      - name: Checkout secure-wazuh
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # aws-terraform-framework's runner protocol (docs/reference/runner-protocol.md,
      # "Deployment Identity Tags"). Exports TF_VAR_resource_metadata for every later terraform
      # step in this job; docs/reference/aws-iam/README.md's StampRepoIdentityTags / RequestTag
      # conditions require it on every create-call, or they deny the request.
      - name: Derive deployment identity + targets
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPOSITORY_ID: ${{ github.repository_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          stack="${GH_REPOSITORY##*/}"          # repo name, e.g. secure-wazuh
          owner="${GH_OWNER}"                    # org, e.g. nwarila-platform
          commit_sha="$(git rev-parse HEAD)"
          {
            echo "DEPLOY_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/github_${owner}_${stack}"
            echo "BUNDLE_BUCKET=${AWS_ACCOUNT_ID}-ansible"
            echo "TF_STATE_BUCKET=${AWS_ACCOUNT_ID}-terraform"
            # Org state-key convention is <owner>/<repo>/<target>.tfstate — derived, so it always
            # matches the bucket layout (and the IAM policy scoped to that prefix) with no input.
            echo "TF_STATE_KEY_PREFIX=${owner}/${stack}"
            printf 'TF_VAR_resource_metadata=%s\n' "$(jq -cn \
              --arg repository "$GH_REPOSITORY" --arg repository_id "$GH_REPOSITORY_ID" \
              --arg stack "$stack" --arg owner "$owner" \
              --arg commit_sha "$commit_sha" --arg run_id "$GH_RUN_ID" \
              '{repository:$repository,repository_id:$repository_id,stack:$stack,owner:$owner,commit_sha:$commit_sha,run_id:$run_id}')"
          } >> "$GITHUB_ENV"

      # EPHEMERAL-TARGET CREDENTIAL POLICY: this AWS PoC is created and destroyed inside this one
      # run, so its Wazuh admin password is minted here, masked, and dies with the environment —
      # there is no standing secret to store, rotate, or leak. Exported ONCE so both phases (the
      # initial deploy and the post-OS-swap redeploy) configure the SAME credential; site.yml reads
      # it from the environment, so this stays zero--e. The PERMANENT Proxmox target deliberately
      # keeps a real managed secret instead — a live instance's password cannot be rotated on every
      # deploy.
      - name: Mint the ephemeral Wazuh admin password
        shell: bash
        run: |
          set -euo pipefail
          # Character-class coverage (upper/lower/digit/symbol) is explicit rather than left to
          # chance in the random segment, so the value always satisfies the stack's password policy.
          pw="Wz9-$(openssl rand -hex 16)-Aa!"
          echo "::add-mask::${pw}"
          echo "WAZUH_ADMIN_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Resolve ansible-framework pin
        id: pin
        run: echo "sha=$(tr -d ' \n\r' < .github/.framework-pin)" >> "$GITHUB_OUTPUT"

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.ANSIBLE_FRAMEWORK_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: .frameworks/ansible-framework
          persist-credentials: false
          # ansible-framework is public — the default GITHUB_TOKEN reads it; no PAT needed.

      - name: Resolve aws-terraform-framework pin
        id: tfpin
        run: echo "sha=$(tr -d ' \n\r' < .github/.aws-tf-framework-pin)" >> "$GITHUB_OUTPUT"

      - name: Checkout aws-terraform-framework (pinned)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.AWS_TF_FRAMEWORK_REPO }}
          # Version-locked in .github/.aws-tf-framework-pin — a committed SHA (currently v1.1.0),
          # reviewable in the diff and reproducible, exactly mirroring .framework-pin for the
          # ansible framework. deploy.yml's AWS job reads the same file, so both track one SHA.
          ref: ${{ steps.tfpin.outputs.sha }}
          path: .frameworks/aws-tf
          persist-credentials: false
          # aws-terraform-framework is public — the default GITHUB_TOKEN reads it; no PAT needed.

      # -----------------------------------------------------------------------
      # AWS auth via OIDC — no long-lived credentials in the repo
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        # WIRE: verify/re-pin this SHA at wire-up time.
        # WIRE: this workflow now also runs on `pull_request` (see the `on:` trigger above), not
        # only push-to-main like deploy.yml — the OIDC role's trust policy, as it exists today,
        # authorizes only `repo:nwarila-platform/secure-wazuh:ref:refs/heads/main` subjects. A
        # PR-triggered run presents a `pull_request` subject instead, which that trust policy
        # does NOT match, so this step will fail assume-role until the trust policy is widened
        # to additionally allow `repo:nwarila-platform/secure-wazuh:pull_request`.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # WIRE: the role ARN is derived from the org-global AWS_ACCOUNT_ID and the
          # github_<owner>_<repo> naming convention. Its trust must cover this repo's OIDC
          # subjects and its policy the existing EC2/EBS/VPC + S3 + Terraform-state scope.
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        # configure-aws-credentials exports AWS_ACCESS_KEY_ID / _SECRET_ACCESS_KEY /
        # _SESSION_TOKEN / AWS_REGION into the runner env for every later step — read by both
        # plain `terraform` invocations below and, via aws_runner_env.yml, by Ansible.

      # -----------------------------------------------------------------------
      # Terraform — ONE init, reused by every apply/destroy below (see the job-level comment)
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.15.1"
          terraform_wrapper: false

      # Shares the routine deploy job's secure-wazuh/aws.tfstate. The shared
      # secure-wazuh-aws-poc concurrency group serializes both workflows so they never touch
      # the singleton PoC state at the same time.
      - name: Terraform init (e2e-full — shared routine deploy aws.tfstate)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY_PREFIX }}/aws.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # Terraform needs no SSH key here (all systems readiness_gate=false, SSM-only); only Ansible
      # reads this key. If a system ever sets readiness_gate=true, Terraform's SSH readiness will
      # also need it and the committed aws.tfvars readiness path (a /root local-harness path) must
      # then be overridden to a runner-readable path.
      - name: Write target SSH key
        run: |
          set -euo pipefail
          # WIRE: the org-global AWS_EC2_SSH_PRIVATE_KEY secret is the private half of
          # terraform/aws.tfvars' key_name = "secure-wazuh-poc-key".
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/stdin "$HOME/.ssh/secure-wazuh-poc-key.pem" <<< "${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}"

      - name: Terraform apply (phase 1 — stand up AIO + both agents)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var-file="${{ github.workspace }}/terraform/aws.tfvars"

      # Not secret (an EC2 instance-id names no account, credential, or address) — recorded now
      # so "Render PoC evidence" can show the OS-swap's before/after without re-querying
      # Terraform after the swap has already replaced it. aws_instances is keyed by hostname
      # (outputs.tf); "secure-wazuh-poc" is the AIO's hostname in terraform/aws.tfvars.
      - name: Capture pre-swap AIO instance-id
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          id="$(terraform output -json aws_instances | jq -r '."secure-wazuh-poc".instance_id')"
          echo "PRE_SWAP_INSTANCE_ID=${id}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Ansible — compose the framework + this repo's roles, then run phase 1
      # -----------------------------------------------------------------------
      - name: Setup Python (controller)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Compose _dev-build (framework base + product-role overlay)
        run: |
          set -euo pipefail
          DEV_BUILD="${GITHUB_WORKSPACE}/_dev-build"
          rm -rf "${DEV_BUILD}"; mkdir -p "${DEV_BUILD}"
          rsync -a "${GITHUB_WORKSPACE}/.frameworks/ansible-framework/" "${DEV_BUILD}/"
          rsync -a "${GITHUB_WORKSPACE}/ansible/" "${DEV_BUILD}/"

      - name: Install ansible-core + collections
        working-directory: _dev-build
        env:
          # Collections must land in the SAME collections_path the composed ansible.cfg
          # points ansible-playbook at (must run AFTER Compose, for the same reason).
          ANSIBLE_CONFIG: ${{ github.workspace }}/_dev-build/ansible.cfg
        run: |
          python -m pip install --no-cache-dir "ansible-core${ANSIBLE_CORE_SPEC}"
          # boto3/botocore: required by amazon.aws modules that run CONTROLLER-side on THIS
          # runner (ADR-0004's account-id derivation, the Windows-agent MSI fetch, and
          # linux_disk_manager's AWS function-tag resolver — all delegate_to: localhost under
          # ansible_playbook_python). Same requirement as deploy.yml's AWS job.
          python -m pip install --no-cache-dir boto3 botocore
          ansible-galaxy collection install -r "${GITHUB_WORKSPACE}/ansible/requirements.yml"

      # The AWS systems take NO inbound SSH (see docs/reference/aws-iam/README.md's zero-ingress
      # note): inventory/aws/group_vars/all.yml tunnels every connection through
      # `aws ssm start-session --document-name AWS-StartSSHSession`, and that ProxyCommand shells
      # out to the Session Manager plugin — a separate binary the AWS CLI does NOT bundle and
      # ubuntu-latest does not ship. Without it every host is UNREACHABLE with the misleading
      # "Connection closed by UNKNOWN port 65535".
      - name: Install the SSM Session Manager plugin (SSH transport for the zero-ingress hosts)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      # `terraform apply` returns when the API says the instances exist, NOT when their SSM agents
      # have registered — and SSM is the only way in. Ansible would otherwise race a host that is
      # still booting (Windows is the slow one). Poll until all three systems report Online.
      - name: Wait for all three systems to register with SSM
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            online="$(aws ssm describe-instance-information \
              --filters "Key=tag:Environment,Values=poc" \
              --query 'length(InstanceInformationList[?PingStatus==`Online`])' --output text)"
            echo "SSM Online: ${online}/3"
            [ "${online}" = "3" ] && exit 0
            sleep 20
          done
          echo "::error::Only ${online:-0}/3 systems registered with SSM within 15 minutes" >&2
          exit 1

      - name: "PHASE 1: deploy_all.yml, then trigger/prove 2 fresh FIM events"
        working-directory: _dev-build
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/_dev-build/ansible.cfg
          # Belt-and-suspenders: the OIDC step above already exports AWS_REGION for every later
          # step, and aws_runner_env.yml prefers it over this — see deploy.yml's AWS job's
          # identical comment on its own equivalent line for the full rationale (kept as a
          # fallback, not redundant by accident).
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # WAZUH_ADMIN_PASSWORD is deliberately NOT bound here: the ephemeral password minted
          # above already reaches every later step through $GITHUB_ENV, and an explicit env: entry
          # would OVERRIDE it (with an empty string when no such secret exists). site.yml's chain
          # reads it straight from the environment — still zero -e.
          # Read by wazuh_trigger_fim.yml's ledger-driven validate play (gated so a local run
          # without this var stays byte-identical) — it writes the machine-readable proof JSON
          # here, controller-side, for "Render PoC evidence" below to consume.
          POC_EVIDENCE_JSON: ${{ github.workspace }}/poc-proof.json
        run: |
          set -euo pipefail
          ansible-playbook -i inventory/aws/aws_ec2.yml playbooks/e2e_full.yml
          # Snapshot phase 1's proof (2 entries) before phase 2 overwrites the same path with the
          # cumulative (4-entry) state — "Render PoC evidence" needs BOTH the phase-1-only and
          # the final cumulative view, and the ledger itself doesn't record which phase produced
          # which entry.
          cp "${POC_EVIDENCE_JSON}" "${{ github.workspace }}/poc-proof-phase1.json"

      # -----------------------------------------------------------------------
      # OS-SWAP — force-replace ONLY the AIO's OS (refresh = true in aws.tfvars); both agents
      # (refresh = false) are untouched. Same working directory, same state — no re-init.
      # -----------------------------------------------------------------------
      - name: Terraform apply (OS-swap — refresh_serial=1, AIO only)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var-file="${{ github.workspace }}/terraform/aws.tfvars" \
            -var refresh_serial=1

      # Same rationale as the pre-swap capture above — not secret, needed for the evidence doc.
      - name: Capture post-swap AIO instance-id
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          id="$(terraform output -json aws_instances | jq -r '."secure-wazuh-poc".instance_id')"
          echo "POST_SWAP_INSTANCE_ID=${id}" >> "$GITHUB_ENV"

      - name: Assert the OS-swap replaced the AIO instance
        run: |
          set -euo pipefail
          if [[ -z "${PRE_SWAP_INSTANCE_ID:-}" || ! "${PRE_SWAP_INSTANCE_ID}" =~ ^i-[0-9a-f]+$ ]]; then
            echo "Invalid or empty pre-swap AIO instance-id: '${PRE_SWAP_INSTANCE_ID:-}'" >&2
            exit 1
          fi
          if [[ -z "${POST_SWAP_INSTANCE_ID:-}" || ! "${POST_SWAP_INSTANCE_ID}" =~ ^i-[0-9a-f]+$ ]]; then
            echo "Invalid or empty post-swap AIO instance-id: '${POST_SWAP_INSTANCE_ID:-}'" >&2
            exit 1
          fi
          if [[ "${PRE_SWAP_INSTANCE_ID}" == "${POST_SWAP_INSTANCE_ID}" ]]; then
            echo "OS-swap did not replace the AIO: instance-id remained ${PRE_SWAP_INSTANCE_ID}" >&2
            exit 1
          fi

      - name: "PHASE 2: redeploy the swapped AIO, then trigger/prove ALL 4 cumulative events"
        working-directory: _dev-build
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/_dev-build/ansible.cfg
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Same path as phase 1 (see that step's comment) — this run overwrites it with the
          # cumulative (4-entry) state; phase 1's own snapshot already survives at
          # poc-proof-phase1.json.
          POC_EVIDENCE_JSON: ${{ github.workspace }}/poc-proof.json
        run: |
          set -euo pipefail
          # SAME command as phase 1 — deploy_all.yml re-provisions the swapped AIO (its data disk
          # already carries an "ours" GPT+label, so linux_disk_manager's mutation-safety guard
          # skips reformatting; the wazuh_server role reinstalls the stack fresh onto the new OS)
          # and idempotent-reconnects both untouched agents; wazuh_trigger_fim.yml then proves
          # all 4 cumulative ledger entries — see playbooks/e2e_full.yml's own header.
          ansible-playbook -i inventory/aws/aws_ec2.yml playbooks/e2e_full.yml

      # -----------------------------------------------------------------------
      # DESTROY — always tear the environment down, pass or fail. Same state, same working dir.
      # Evidence is published only after this succeeds, so it cannot claim teardown on failure.
      # -----------------------------------------------------------------------
      - name: Terraform destroy (always)
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var-file="${{ github.workspace }}/terraform/aws.tfvars"

      # -----------------------------------------------------------------------
      # PoC EVIDENCE — self-proving MRs. The instance-ids captured in GITHUB_ENV and the
      # workspace proof JSONs survive destroy. Default success gating on Render, and the existing
      # event gates on Fold/Upload, publish only when both proof phases AND destroy succeeded.
      # -----------------------------------------------------------------------
      - name: Render PoC evidence
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha_short="$(git rev-parse --short HEAD)"
          gen_date="$(date -u +%Y-%m-%d)"
          phase1="${{ github.workspace }}/poc-proof-phase1.json"
          phase2="${{ github.workspace }}/poc-proof.json"
          out="${{ github.workspace }}/docs/reference/poc-evidence.md"

          jq -e '
            (.entries | type == "array") and
            (.entries | length == 2) and
            ([.entries[] | select(.proven == true)] | length == 2) and
            ([.entries[] | select(.platform == "linux")] | length == 1) and
            ([.entries[] | select(.platform == "windows")] | length == 1)
          ' "$phase1" >/dev/null || {
            echo "Phase 1 proof must contain exactly 2 proven entries: 1 linux + 1 windows" >&2
            exit 1
          }
          jq -e '
            (.entries | type == "array") and
            (.entries | length == 4) and
            ([.entries[] | select(.proven == true)] | length == 4) and
            ([.entries[] | select(.platform == "linux")] | length == 2) and
            ([.entries[] | select(.platform == "windows")] | length == 2)
          ' "$phase2" >/dev/null || {
            echo "Phase 2 proof must contain exactly 4 proven entries: 2 linux + 2 windows" >&2
            exit 1
          }

          phase1_n="$(jq -r '.totals.proven' "$phase1")"
          phase2_n="$(jq -r '.totals.proven' "$phase2")"
          row_fmt='"| \(.agent) | \(.platform) | \(.rule_id) | \(.marker) |"'

          {
            echo "# Proof of Concept — live e2e evidence"
            echo
            echo "> Regenerated automatically by the e2e-full workflow on each proven MR."
            echo
            echo "**Provenance:** [workflow run](${RUN_URL}) · run \`${RUN_ID}\` · event \`${EVENT_NAME}\` · commit \`${sha_short}\`"
            echo "**Date:** ${gen_date}"
            echo
            echo "## Phase 1 — initial deploy, fresh FIM proof"
            echo
            echo "${phase1_n}/${phase1_n} entries proven:"
            echo
            echo "| Agent | Platform | Rule | Marker |"
            echo "|---|---|---|---|"
            jq -r ".entries[] | ${row_fmt}" "$phase1"
            echo
            echo "## OS-swap — AIO OS-drive replacement"
            echo
            echo "- Pre-swap AIO instance: \`${PRE_SWAP_INSTANCE_ID}\`"
            echo "- Post-swap AIO instance: \`${POST_SWAP_INSTANCE_ID}\`"
            echo "- Data volume: preserved and re-attached (not replaced)"
            echo
            echo "## Phase 2 — cumulative validation after the swap"
            echo
            # Built across two source lines (yamllint line-length) but ONE rendered markdown
            # line — separate echo calls here would inject an unwanted mid-sentence line break.
            phase2_note="${phase2_n}/${phase2_n} cumulative ledger entries proven (pre-swap survivors + "
            phase2_note+="new events) — agents reconnect after a manager OS rebuild AND data persists:"
            echo "$phase2_note"
            echo
            echo "| Agent | Platform | Rule | Marker |"
            echo "|---|---|---|---|"
            jq -r ".entries[] | ${row_fmt}" "$phase2"
            echo
            echo "## Teardown"
            echo
            echo "This environment was destroyed successfully before this evidence was published"
            echo "(\`terraform destroy -auto-approve\` — see this workflow's own"
            echo "\"Terraform destroy (always)\" step)."
            echo
            echo "## Cost"
            echo
            echo "~\$1 total, torn down automatically. \$0 standing."
          } > "$out"

          # Belt: the JSON this reads carries no account id (see wazuh_trigger_fim.yml's proof
          # task), but guard the rendered file anyway. Word-bounded (\b): unbounded, this
          # corrupted 12-digit runs embedded INSIDE hex instance-ids (e.g.
          # i-0b29a5ba327a90496) — \b does not match between two word characters (a hex letter
          # and a digit are both "word" characters), so a real standalone 12-digit account id is
          # still caught while an embedded run inside an identifier is left alone.
          sed -i 's/\b[0-9]\{12\}\b/<acct>/g' "$out"

      # web-flow-signed/Verified commit, NEVER `git commit`/`git push`: a runner-local commit
      # would be authored by whatever (or no) local git identity is configured and land
      # unsigned. The GitHub contents API commit is instead signed by GitHub on the Actions
      # bot's behalf and shows Verified in the UI — the same bot-authored Verified pattern
      # release-please.yml's googleapis/release-please-action already relies on for its own
      # commits. GET-then-PUT: the API requires the CURRENT blob sha to update an existing file
      # (optimistic concurrency); omit it entirely on a 404 (file not yet on this branch).
      - name: Fold evidence into the MR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # PR head-branch names are attacker-influenceable (a fork can name its branch
          # anything) — pass through an env var rather than splicing ${{ github.head_ref }}
          # directly into the script text below (script-injection hardening).
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api_path="repos/${REPO}/contents/docs/reference/poc-evidence.md"
          content_b64="$(base64 -w0 docs/reference/poc-evidence.md)"
          existing_sha="$(gh api "${api_path}?ref=${HEAD_REF}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "${existing_sha}" ]; then
            gh api --method PUT "${api_path}" \
              -f message="docs(poc): fold e2e proof evidence into this MR" \
              -f content="${content_b64}" \
              -f branch="${HEAD_REF}" \
              -f sha="${existing_sha}"
          else
            gh api --method PUT "${api_path}" \
              -f message="docs(poc): fold e2e proof evidence into this MR" \
              -f content="${content_b64}" \
              -f branch="${HEAD_REF}"
          fi

      # dispatch runs have no PR to fold evidence into — an artifact is the equivalent record.
      - name: Upload PoC evidence as an artifact (dispatch runs only)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poc-evidence
          path: docs/reference/poc-evidence.md
          retention-days: 90
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # FAILURE BACKSTOP — the cost-control backstop; destroy-always above is the record's
      # PRIMARY control (same principle as docs/reference/aws-iam/README.md's cost & count
      # backstops section). This only matters if destroy ITSELF failed, or something upstream
      # aborted the job before destroy could even run, and orphaned billable resources are left
      # standing. A `terraform state pull` snapshot, taken only on failure, records exactly what
      # existed at failure time (instance IDs, volume IDs, ...) so a human can destroy manually —
      # `terraform destroy` against the same backend-config, or a direct `aws ec2
      # terminate-instances` / `aws ec2 delete-volume` from the snapshot's resource IDs — without
      # first having to reconstruct this job's state locally. Uploaded, not just logged, because
      # the run's own logs expire well before this snapshot should.
      # -----------------------------------------------------------------------
      - name: On failure, snapshot Terraform state for manual recovery
        if: ${{ failure() }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: terraform state pull > "${{ github.workspace }}/e2e-full-failure-state.json"

      - name: On failure, upload the state snapshot as an artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-full-failure-state
          path: e2e-full-failure-state.json
          retention-days: 14
          if-no-files-found: warn
